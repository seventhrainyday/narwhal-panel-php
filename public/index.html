<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>独角鲸控制面板 · Narwhal Cloud</title>
<style>
:root{
  --bg:#0f1420; --card:#1a2233; --card2:#222c42; --line:#2c3a55;
  --txt:#e8edf7; --muted:#8b98b3; --acc:#4da3ff; --ok:#3ddc84; --warn:#ffb020; --bad:#ff5d5d;
  --r:12px;
}
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--txt); font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh}
a{color:var(--acc)}
header{position:sticky; top:0; z-index:50; background:#131a29ee; backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.hwrap{max-width:1180px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.logo{font-size:20px; font-weight:800; white-space:nowrap}
.logo small{font-weight:400; color:var(--muted); font-size:12px; margin-left:6px}
.keybox{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.keybox input{width:280px; max-width:60vw}
input,select,textarea{background:#0d1320; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px 10px; font-size:14px}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--acc)}
textarea{width:100%; min-height:90px; resize:vertical}
button{background:var(--acc); color:#04121f; border:0; border-radius:8px; padding:8px 14px; font-size:14px; font-weight:700; cursor:pointer}
button:hover{filter:brightness(1.1)}
button.ghost{background:transparent; color:var(--txt); border:1px solid var(--line)}
button.danger{background:var(--bad); color:#fff}
button.warnb{background:var(--warn); color:#201400}
button.okb{background:var(--ok); color:#03210f}
button:disabled{opacity:.45; cursor:not-allowed}
button.sm{padding:4px 10px; font-size:12px; border-radius:6px}
nav.tabs{max-width:1180px; margin:0 auto; padding:0 16px; display:flex; gap:4px; overflow-x:auto; border-top:1px solid var(--line)}
nav.tabs button{background:none; color:var(--muted); border-radius:0; padding:12px 14px; font-weight:600; border-bottom:3px solid transparent; white-space:nowrap}
nav.tabs button.on{color:var(--txt); border-bottom-color:var(--acc)}
main{max-width:1180px; margin:0 auto; padding:18px 16px 80px}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px}
.card h3{font-size:16px; margin-bottom:8px; word-break:break-all}
.card .row{display:flex; justify-content:space-between; gap:8px; padding:3px 0; font-size:13px}
.card .row b{font-weight:600}
.muted{color:var(--muted)} .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.pill{display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; background:var(--card2); border:1px solid var(--line)}
.pill.ok{background:#0e2f1f; color:var(--ok); border-color:#1d5c37}
.pill.bad{background:#331414; color:var(--bad); border-color:#6b2222}
.pill.warn{background:#33270e; color:var(--warn); border-color:#6b521c}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; align-items:center}
.toolbar input,.toolbar select{min-width:0}
table{width:100%; border-collapse:collapse; font-size:13px; background:var(--card); border-radius:var(--r); overflow:hidden}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top}
th{color:var(--muted); font-weight:600; background:var(--card2); white-space:nowrap}
tr:last-child td{border-bottom:0}
.kv{display:grid; grid-template-columns:150px 1fr; gap:6px 12px; font-size:14px}
.kv dt{color:var(--muted)} .kv dd{word-break:break-all}
#toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:200; display:flex; flex-direction:column; gap:8px; align-items:center}
.toastmsg{background:#1d2740; border:1px solid var(--acc); padding:10px 18px; border-radius:10px; box-shadow:0 6px 24px #000a; max-width:90vw}
.toastmsg.err{border-color:var(--bad)}
#modal{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; background:#000a; padding:16px}
#modal.open{display:flex}
.mbox{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; width:520px; max-width:96vw; max-height:88vh; overflow:auto}
.mbox h3{margin-bottom:12px}
.mbox .fld{margin-bottom:10px}
.mbox .fld label{display:block; color:var(--muted); font-size:13px; margin-bottom:4px}
.mbox .fld input,.mbox .fld select,.mbox .fld textarea{width:100%}
.mfoot{display:flex; gap:8px; justify-content:flex-end; margin-top:14px}
pre.dump{background:#0d1320; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font-size:12px; max-height:300px}
.pager{display:flex; gap:10px; align-items:center; margin-top:12px; justify-content:center}
.empty{color:var(--muted); text-align:center; padding:40px 10px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:760px){.grid2{grid-template-columns:1fr} .kv{grid-template-columns:120px 1fr}}
.badge{font-size:11px; background:var(--card2); border:1px solid var(--line); padding:1px 8px; border-radius:12px; color:var(--muted)}
.backlink{cursor:pointer; color:var(--acc); font-size:14px; margin-bottom:10px; display:inline-block}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo">🦈 独角鲸<small>Narwhal Cloud 控制面板</small></div>
    <div class="keybox">
      <input id="apikey" type="password" placeholder="粘贴 API 密钥 (rnm_...)" autocomplete="off">
      <button id="savekey" class="sm">保存并连接</button>
      <button id="clearkey" class="sm ghost">清除</button>
      <span id="connstat" class="pill">未连接</span>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="main"></main>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<script>
"use strict";
/* ================= 基础 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTime = t => { if(!t) return "-"; const d = new Date(t*1000); return d.toLocaleString("zh-CN",{hour12:false}); };
const fmtMoney = n => n==null||n==="" ? "-" : "$" + Number(n).toFixed(2);
const fmtBytes = b => { if(b==null) return "-"; const u=["B","KB","MB","GB","TB"]; let i=0; b=Number(b); while(b>=1024&&i<4){b/=1024;i++;} return b.toFixed(2)+" "+u[i]; };
const daysLeft = t => { if(!t) return "-"; const d = Math.ceil((t*1000-Date.now())/86400000); return d<0 ? `<span class="bad">已过期 ${-d} 天</span>` : (d<=3?`<span class="warn">${d} 天</span>`:`${d} 天`); };

function toast(msg, err){
  const d = document.createElement("div");
  d.className = "toastmsg" + (err ? " err" : "");
  d.textContent = msg;
  $("#toast").appendChild(d);
  setTimeout(()=>d.remove(), 3600);
}
/* 模态框: modal({title, bodyHTML, okText}) -> Promise<HTMLElement|null> (表单容器, 点确定返回容器, 点取消返回null) */
function modal(title, bodyHTML, okText){
  return new Promise(res=>{
    const m = $("#modal"), box = $("#mbox");
    box.innerHTML = `<h3>${esc(title)}</h3><div class="mbody">${bodyHTML}</div>
      <div class="mfoot"><button class="ghost" id="m_cancel">取消</button>
      <button id="m_ok">${esc(okText||"确定")}</button></div>`;
    m.classList.add("open");
    const done = v => { m.classList.remove("open"); res(v); };
    box.querySelector("#m_cancel").onclick = ()=>done(null);
    box.querySelector("#m_ok").onclick = ()=>done(box.querySelector(".mbody"));
    m.onclick = e => { if(e.target===m) done(null); };
  });
}
function fld(label, inner){ return `<div class="fld"><label>${esc(label)}</label>${inner}</div>`; }
const inp = (id, val="", ph="", type="text") => `<input id="${id}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}">`;

/* ================= API 客户端 ================= */
const S = {
  key: localStorage.getItem("narwhal_key") || "",
  authed: false,
};
// 组装 query string: 自动丢弃 undefined/null/空字符串, 避免 "search=undefined" 发到服务端
const qs = p => new URLSearchParams(
  Object.fromEntries(Object.entries(p||{}).filter(([,v])=>v!==undefined&&v!==null&&v!=="")));
async function req(method, path, body, opt={}){
  const headers = {};
  if(S.key) headers["Authorization"] = "Bearer " + S.key;
  let payload = null;
  if(body instanceof FormData){ payload = body; }              // 浏览器自动设 multipart boundary
  else if(body !== undefined){ headers["Content-Type"]="application/json"; payload = JSON.stringify(body); }
  let res;
  try{
    res = await fetch("/api/" + path.replace(/^\/+/,""), {method, headers, body: payload});
  }catch(e){ throw new Error("网络请求失败: "+e.message); }
  if(res.status === 401){ S.authed=false; paintConn(); throw new Error("401 未授权: API 密钥无效或已过期"); }
  if(opt.raw) return res;                                      // 下载类: 调用方自己处理
  const text = await res.text();
  let j;
  try{ j = JSON.parse(text); }catch(e){ throw new Error(`服务端返回非 JSON (HTTP ${res.status})`); }
  if(j && typeof j.code !== "undefined" && j.code !== 0) throw new Error(j.msg || ("错误码 "+j.code));
  return j ? j.data : null;
}
const api = {
  // 认证 / 用户
  login: (email,password)=>req("POST","auth/login",{email,password}),
  me: ()=>req("GET","user/me"),
  updateNotify: b=>req("PATCH","user/me/notify",b),
  testNotify: ()=>req("POST","user/me/test-notify"),
  updatePayInfo: text=>req("PATCH","user/me/payment-info",{text}),
  uploadPayQR: fd=>req("POST","user/me/payment-qr",fd),
  tgBindStart: ()=>req("POST","user/me/tg-bind/start"),
  tgUnbind: ()=>req("DELETE","user/me/tg-bind"),
  changePassword: p=>req("POST","user/password",{new_password:p}),
  getApiKey: ()=>req("GET","user/apikey"),
  rotateApiKey: ()=>req("POST","user/apikey"),
  deleteApiKey: ()=>req("DELETE","user/apikey"),
  // 公开
  announcements: (p={})=>req("GET","announcements?"+qs(p)),
  publicMachines: ()=>req("GET","machines/public"),
  publicMachine: id=>req("GET",`machines/${id}/public`),
  testSpeed: (id,codes)=>req("POST",`machines/${id}/test-speed`,{country_codes:codes}),
  tgbot: ()=>req("GET","tgbot/info"),
  plans: (p={})=>req("GET","plans?"+qs(p)),
  plan: id=>req("GET",`plans/${id}`),
  promoPreview: (code,plan_id,amount)=>req("GET","promo-codes/preview?"+qs({code,plan_id,amount})),
  // VM
  vms: (p={})=>req("GET","vms?"+qs(p)),
  buyVM: b=>req("POST","vms",b),
  vm: id=>req("GET",`vms/${id}`),
  destroyVM: id=>req("DELETE",`vms/${id}`),
  refundPreview: id=>req("GET",`vms/${id}/refund-preview`),
  renewVM: id=>req("POST",`vms/${id}/renew`),
  autoRenewVM: (id,v)=>req("PATCH",`vms/${id}/auto-renew`,{auto_renew:v}),
  startVM: id=>req("POST",`vms/${id}/start`),
  stopVM: (id,force)=>req("POST",`vms/${id}/stop`,{force:!!force}),
  restartVM: id=>req("POST",`vms/${id}/restart`),
  resetPw: (id,pw)=>req("POST",`vms/${id}/reset-password`,pw?{new_password:pw}:{}),
  reinstall: (id,img,pw)=>req("POST",`vms/${id}/reinstall`,pw?{os_image:img,new_password:pw}:{os_image:img}),
  remarkVM: (id,r)=>req("PATCH",`vms/${id}/remark`,{remark:r}),
  tagsVM: (id,t)=>req("PATCH",`vms/${id}/tags`,{tags:t}),
  pushVM: (id,rcpt)=>req("POST",`vms/${id}/push`,{recipient:rcpt}),
  portFwds: id=>req("GET",`vms/${id}/port-forwards`),
  addPortFwd: (id,b)=>req("POST",`vms/${id}/port-forwards`,b),
  delPortFwd: (id,proto,port)=>req("DELETE",`vms/${id}/port-forwards/${proto}/${port}`),
  // 市场
  listings: (p={})=>req("GET","market/listings?"+qs(p)),
  listing: id=>req("GET",`market/listings/${id}`),
  createListing: b=>req("POST","market/listings",b),
  cancelListing: id=>req("DELETE",`market/listings/${id}`),
  buyListing: id=>req("POST",`market/listings/${id}/buy`),
  myListings: (p={})=>req("GET","market/my-listings?"+qs(p)),
  // IP 资源
  ipPools: ()=>req("GET","ip-resources/pools"),
  ipResources: (p={})=>req("GET","ip-resources?"+qs(p)),
  rentIP: b=>req("POST","ip-resources",b),
  ipResource: id=>req("GET",`ip-resources/${id}`),
  renewIP: id=>req("POST",`ip-resources/${id}/renew`),
  autoRenewIP: (id,v)=>req("PATCH",`ip-resources/${id}/auto-renew`,{auto_renew:v}),
  remarkIP: (id,r)=>req("PATCH",`ip-resources/${id}/remark`,{remark:r}),
  bindIP: (id,vm_id)=>req("POST",`ip-resources/${id}/bind`,{vm_id}),
  unbindIP: id=>req("POST",`ip-resources/${id}/unbind`),
  resetIPKey: id=>req("POST",`ip-resources/${id}/reset-key`),
  ipClientConfig: id=>req("GET",`ip-resources/${id}/client-config`,undefined,{raw:true}),
  // 账单 / 支付 / 提现
  transactions: (p={})=>req("GET","billing/transactions?"+qs(p)),
  orders: (p={})=>req("GET","billing/orders?"+qs(p)),
  payRecords: (p={})=>req("GET","payment/records?"+qs(p)),
  payRecord: id=>req("GET",`payment/records/${id}`),
  payInit: (gw,b)=>req("POST",`payment/${gw}/init`,b),
  wdInfo: ()=>req("GET","withdrawals/info"),
  withdraw: b=>req("POST","withdrawals",b),
  withdrawal: id=>req("GET",`withdrawals/${id}`),
  // 工单
  tickets: (p={})=>req("GET","tickets?"+qs(p)),
  createTicket: b=>req("POST","tickets",b),
  ticket: id=>req("GET",`tickets/${id}`),
  replyTicket: (id,content)=>req("POST",`tickets/${id}/messages`,{content}),
  closeTicket: id=>req("PUT",`tickets/${id}/close`),
  reopenTicket: id=>req("PUT",`tickets/${id}/reopen`),
  // 机器主
  machines: (p={})=>req("GET","machines?"+qs(p)),
  registerMachine: b=>req("POST","machines",b),
  machine: id=>req("GET",`machines/${id}`),
  updateMachine: (id,b)=>req("PATCH",`machines/${id}`,b),
  deleteMachine: id=>req("DELETE",`machines/${id}`),
  rotateToken: id=>req("POST",`machines/${id}/rotate-token`),
  notifyBuyers: (id,b)=>req("POST",`machines/${id}/notify-buyers`,b),
  machineVMs: (id,p={})=>req("GET",`machines/${id}/vms?`+qs(p)),
  machinePlans: (id,p={})=>req("GET",`machines/${id}/plans?`+qs(p)),
  createMachinePlan: (id,b)=>req("POST",`machines/${id}/plans`,b),
  updatePlan: (id,b)=>req("PATCH",`plans/${id}`,b),
  deletePlan: id=>req("DELETE",`plans/${id}`),
  machinePromos: (id,p={})=>req("GET",`machines/${id}/promo-codes?`+qs(p)),
  createPromo: b=>req("POST","promo-codes",b),
  enablePromo: id=>req("PUT",`promo-codes/${id}/enable`),
  disablePromo: id=>req("PUT",`promo-codes/${id}/disable`),
  deletePromo: id=>req("DELETE",`promo-codes/${id}`),
  blockedUsers: (p={})=>req("GET","machines/blocked-users?"+qs(p)),
  unblockUser: uid=>req("DELETE",`machines/blocked-users/${uid}`),
  // 文件
  uploadFile: fd=>req("POST","files/upload",fd),
};

/* ================= 顶部: 密钥 & 连接状态 ================= */
function paintConn(){
  const el = $("#connstat");
  if(S.authed){ el.textContent="已连接"; el.className="pill ok"; }
  else if(S.key){ el.textContent="密钥已填(未验证)"; el.className="pill warn"; }
  else { el.textContent="未连接"; el.className="pill"; }
}
async function verifyKey(){
  if(!S.key){ S.authed=false; paintConn(); return false; }
  try{ await api.me(); S.authed=true; }
  catch(e){ S.authed=false; toast("连接失败: "+e.message, true); }
  paintConn();
  return S.authed;
}
function needAuth(){
  return `<div class="empty">🔑 请先在右上角填写 API 密钥并点击「保存并连接」<br>
    <span class="muted">密钥在独角鲸官网 → 个人资料页生成 (以 rnm_ 开头)</span></div>`;
}

/* ================= 标签页路由 ================= */
const TABS = [
  ["home","🏠 我的"], ["vms","🖥️ 云主机"], ["buy","🛒 购买"],
  ["market","🔁 二手市场"], ["ips","🌐 IP资源"], ["bill","💰 账单"],
  ["tickets","🎫 工单"], ["owner","🏭 机器主"], ["settings","⚙️ 设置"],
];
let curTab = "home";
function renderTabs(){
  $("#tabs").innerHTML = TABS.map(([k,n])=>`<button data-t="${k}" class="${k===curTab?'on':''}">${n}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{ curTab=b.dataset.t; renderTabs(); route(); });
}
async function route(){
  const M = $("#main");
  M.innerHTML = `<div class="empty">加载中…</div>`;
  try{
    if(curTab==="home") await tabHome(M);
    else if(curTab==="vms") await tabVMs(M);
    else if(curTab==="buy") await tabBuy(M);
    else if(curTab==="market") await tabMarket(M);
    else if(curTab==="ips") await tabIPs(M);
    else if(curTab==="bill") await tabBill(M);
    else if(curTab==="tickets") await tabTickets(M);
    else if(curTab==="owner") await tabOwner(M);
    else if(curTab==="settings") await tabSettings(M);
  }catch(e){ M.innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`; }
}
function statusPill(s){
  s = String(s||"").toLowerCase();
  if(["running","active","online","paid","open","resolved"].includes(s)) return `<span class="pill ok">${esc(s)}</span>`;
  if(["stopped","offline","expired","closed","failed","disabled","banned"].includes(s)) return `<span class="pill bad">${esc(s)}</span>`;
  if(["pending","creating","suspended"].includes(s)) return `<span class="pill warn">${esc(s)}</span>`;
  return `<span class="pill">${esc(s||"-")}</span>`;
}

/* ================= 🏠 我的 ================= */
async function tabHome(M){
  let meHtml = needAuth(), annHtml = "";
  if(S.key){
    try{
      const me = await api.me();
      meHtml = `<div class="grid2">
        <div class="card"><h3>👤 ${esc(me.email||"")}</h3>
          <div class="row"><span class="muted">可用余额</span><b class="ok">${fmtMoney(me.available_balance)}</b></div>
          <div class="row"><span class="muted">托管余额</span><b>${fmtMoney(me.escrow_balance)}</b></div>
          <div class="row"><span class="muted">托管锁定</span><b>${fmtMoney(me.escrow_locked_value)}</b></div>
          <div class="row"><span class="muted">佣金率</span><b>${me.commission_rate==null?"-":(Number(me.commission_rate)*100).toFixed(1)+"%"}</b></div>
          <div class="row"><span class="muted">角色</span><b>${esc(me.role||"-")}</b></div>
          <div class="row"><span class="muted">通知方式</span><b>${esc(me.notify_via||"-")} / ${esc(me.notify_lang||"-")}</b></div>
          <div class="row"><span class="muted">Telegram</span><b>${me.tg_chat_id?"已绑定":"未绑定"}</b></div>
          <div class="row"><span class="muted">注册时间</span><b>${fmtTime(me.created_at)}</b></div>
        </div>
        <div class="card"><h3>📣 平台公告</h3><div id="ann_list"><span class="muted">加载中…</span></div></div>
      </div>`;
    }catch(e){ meHtml = `<div class="empty">❌ ${esc(e.message)}</div>`; }
  }
  M.innerHTML = meHtml;
  if(S.key){
    try{
      const d = await api.announcements({page:1,page_size:10});
      const list = d.announcements || d.items || d || [];
      $("#ann_list").innerHTML = (Array.isArray(list)?list:[]).map(a=>`
        <div style="margin-bottom:10px"><b>${esc(a.title)}</b>
        <div class="muted" style="font-size:13px">${a.content||""}</div></div>`).join("") || `<span class="muted">暂无公告</span>`;
    }catch(e){ const el=$("#ann_list"); if(el) el.innerHTML = `<span class="bad">${esc(e.message)}</span>`; }
  }
}

/* ================= 🖥️ 云主机 ================= */
let vmPage = 1, vmSearch = "";
async function tabVMs(M){
  if(!S.key){ M.innerHTML = needAuth(); return; }
  M.innerHTML = `
    <div class="toolbar">
      <input id="vm_q" placeholder="按备注搜索…" value="${esc(vmSearch)}" style="width:220px">
      <button id="vm_go" class="sm">搜索</button>
      <button id="vm_new" class="sm okb">＋ 购买新主机</button>
    </div>
    <div class="cards" id="vm_cards"></div>
    <div class="pager" id="vm_pager"></div>`;
  $("#vm_go").onclick = ()=>{ vmSearch=$("#vm_q").value.trim(); vmPage=1; loadVMs(); };
  $("#vm_q").onkeydown = e=>{ if(e.key==="Enter") $("#vm_go").click(); };

async function loadVMs(){
  const box = $("#vm_cards"); if(!box) return;
  box.innerHTML = `<div class="empty">加载中…</div>`;
  try{
    const d = await api.vms({page:vmPage,page_size:20,search:vmSearch||undefined});
    const vms = d.vms||[];
    box.innerHTML = vms.map(v=>`
      <div class="card" style="cursor:pointer" data-vm="${v.id}">
        <h3>${esc(v.remark||"(未备注)")} ${statusPill(v.status)}</h3>
        <div class="row"><span class="muted">IP</span><b>${esc(v.ip||(v.ip_addresses||[])[0]||"-")}</b></div>
        <div class="row"><span class="muted">配置</span><b>${v.cpu}C / ${(v.ram_mb/1024).toFixed(1)}G / ${v.disk_gb}G</b></div>
        <div class="row"><span class="muted">地区</span><b>${esc(v.machine_region||"-")} · ${esc(v.machine_name||"")}</b></div>
        <div class="row"><span class="muted">到期</span><b>${fmtTime(v.expires_at)} (${daysLeft(v.expires_at)})</b></div>
        <div class="row"><span class="muted">月价</span><b>${fmtMoney(v.price_monthly)}</b></div>
      </div>`).join("") || `<div class="empty">没有云主机</div>`;
    box.querySelectorAll("[data-vm]").forEach(c=>c.onclick=()=>vmDetail(c.dataset.vm));
    const total = d.total||0, pages = Math.max(1, Math.ceil(total/20));
    $("#vm_pager").innerHTML = total?`
      <button class="sm ghost" ${vmPage<=1?"disabled":""} id="vp">上一页</button>
      <span class="muted">${vmPage} / ${pages} (共 ${total})</span>
      <button class="sm ghost" ${vmPage>=pages?"disabled":""} id="vn">下一页</button>`:"";
    const p=$("#vp"), n=$("#vn");
    if(p) p.onclick=()=>{vmPage--;loadVMs();};
    if(n) n.onclick=()=>{vmPage++;loadVMs();};
  }catch(e){ box.innerHTML = `<div class="empty">❌ ${esc(e.message)}</div>`; }
}

async function loadMarket(){

    let list, total=0;
    if(mkMine){

      list = d.listings||d.items||[]; total = d.total||list.length;

      const rg=$("#mk_region").value.trim(); if(rg) p.region=rg;
      const mp=$("#mk_maxp").value; if(mp) p.max_price=mp;

      list = d.listings||d.items||[]; total = d.total||list.length;
    }

      <div class="card">
        <h3>${fmtMoney(l.price)} <span class="muted" style="font-size:13px">/月</span> ${statusPill(l.status)}</h3>

        <div class="toolbar" style="margin:8px 0 0">
          ${mkMine?`<button class="sm danger" data-cancel="${l.id}">下架</button>`
                  :`<button class="sm okb" data-buyl="${l.id}">购买</button>`}
        </div>
      </div>`).join("");
    B.innerHTML = cards ? `<div class="cards">${cards}</div>` : `<div class="empty">暂无挂售</div>`;
    B.querySelectorAll("[data-buyl]").forEach(b=>b.onclick=async()=>{
      if(!S.key){ toast("请先填写 API 密钥",true); return; }
      const f = await modal("购买二手主机",`<p>确认以 <b class="ok">${esc(b.closest(".card").querySelector("h3").textContent)}</b> 购买该主机吗？</p>`,"确认购买");
      if(!f) return;
      try{ await api.buyListing(b.dataset.buyl); toast("购买成功!"); curTab="vms"; renderTabs(); route(); }
      catch(e){ toast(e.message,true); }
    });
    B.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=async()=>{
      const f = await modal("下架",`<p>确定下架该挂售吗？</p>`,"下架");
      if(!f) return;
      try{ await api.cancelListing(b.dataset.cancel); toast("已下架"); loadMarket(); }catch(e){ toast(e.message,true); }
    });
    const pages = Math.max(1, Math.ceil(total/20));
    $("#mk_pager").innerHTML = total?`<button class="sm ghost" ${mkPage<=1?"disabled":""} id="kp">上一页</button>
      <span class="muted">${mkPage} / ${pages} (共 ${total})</span>
      <button class="sm ghost" ${mkPage>=pages?"disabled":""} id="kn">下一页</button>`:"";
    const p=$("#kp"), n=$("#kn");
    if(p) p.onclick=()=>{mkPage--;loadMarket();};
    if(n) n.onclick=()=>{mkPage++;loadMarket();};
  }catch(e){ B.innerHTML=`<div class="empty">❌ ${esc(e.message)}</div>`; }
}

      if(c) c.onclick=async()=>{ const f=await modal("关闭工单","<p>确定关闭该工单吗？</p>","关闭"); if(f){ try{await api.closeTicket(id);toast("已关闭");render();}catch(e){toast(e.message,true);} } };

        try{ await api.replyTicket(id,v); toast("已发送"); render(); }catch(e){ toast(e.message,true); } };
    }catch(e){ M.innerHTML=`<div class="empty">❌ ${esc(e.message)}<br><span class="backlink" onclick="route()">← 返回</span></div>`; }
  };
  await render();

      const me=await api.me();
      if(me.tg_chat_id){ $("#tg_box").innerHTML=`<p><span class="ok">✅ 已绑定</span></p><button class="sm danger" id="tg_un">解绑</button>`;
        $("#tg_un").onclick=async()=>{ const f=await modal("解绑 Telegram","<p>确定解绑吗？</p>","解绑"); if(f){ try{await api.tgUnbind();toast("已解绑");tgBox();}catch(e){toast(e.message,true);} } };
      }else{
        let bot={};
        try{ bot=await api.tgbot(); }catch(e){}
        $("#tg_box").innerHTML=`<p class="muted">未绑定。点击开始绑定, 在 10 分钟内按提示操作。</p>
          ${bot.bot_url?`<p><a href="${esc(bot.bot_url)}" target="_blank" rel="noopener">🤖 ${esc(bot.bot_name||"Telegram Bot")}</a></p>`:""}
          <button class="sm" id="tg_start">开始绑定</button><div id="tg_code" style="margin-top:8px"></div>`;
        $("#tg_start").onclick=async()=>{ try{ const r=await api.tgBindStart();
            const url=r.tg_bot_url||r.bind_url||(bot.bot_url||"");
            $("#tg_code").innerHTML=`<pre class="dump">${esc(JSON.stringify(r,null,2))}</pre>${url?`<p><a href="${esc(url)}" target="_blank" rel="noopener">👉 前往绑定</a></p>`:""}`;
          }catch(e){ toast(e.message,true); } };
      }
    }catch(e){ $("#tg_box").innerHTML=`<span class="bad">${esc(e.message)}</span>`; }
  };
  tgBox();
  // API key
  $("#k_view").onclick=async()=>{ try{ const k=await api.getApiKey();
      $("#k_out").innerHTML=`<pre class="dump">${esc(typeof k==="string"?k:JSON.stringify(k))}</pre>`; }catch(e){ toast(e.message,true); } };
  $("#k_rotate").onclick=async()=>{ const f=await modal("轮换密钥","<p class='bad'>将生成新密钥, 旧密钥立即失效!</p>","确认轮换");
    if(!f) return;
    try{ const k=await api.rotateApiKey();
      const nk = typeof k==="string"?k:(k.api_key||k.key||JSON.stringify(k));
      $("#k_out").innerHTML=`<p class="ok">新密钥 (请立即复制保存):</p><pre class="dump">${esc(nk)}</pre>`;
      S.key=nk; localStorage.setItem("narwhal_key",nk); $("#apikey").value=nk; S.authed=true; paintConn();
    }catch(e){ toast(e.message,true); } };
  $("#k_del").onclick=async()=>{ const f=await modal("删除密钥","<p class='bad'>删除后该密钥永久失效!</p>"+fld("输入 DELETE 确认",inp("f_cf","","DELETE")),"删除");
    if(!(f&&f.querySelector("#f_cf").value.trim()==="DELETE")) return;
    try{ await api.deleteApiKey(); S.key=""; S.authed=false; localStorage.removeItem("narwhal_key"); $("#apikey").value=""; paintConn(); toast("密钥已删除"); route(); }catch(e){ toast(e.message,true); } };
  // 密码
  $("#pw_go").onclick=async()=>{ const p=$("#pw_new").value; if(!p){toast("请输入新密码",true);return;}
    try{ await api.changePassword(p); toast("密码已修改"); $("#pw_new").value=""; }catch(e){ toast(e.message,true); } };
  // 收款信息
  $("#pi_save").onclick=async()=>{ try{ await api.updatePayInfo($("#pi_text").value); toast("已保存"); }catch(e){ toast(e.message,true); } };
  $("#pi_up").onclick=async()=>{ const fi=$("#pi_qr").files[0]; if(!fi){toast("请先选择图片",true);return;}
    const fd=new FormData(); fd.append("file",fi);
    try{ const r=await api.uploadPayQR(fd); $("#pi_out").innerHTML=`<span class="ok">上传成功:</span> <a href="${esc(r.url||"")}" target="_blank" rel="noopener">${esc(r.url||"")}</a>`; }catch(e){ toast(e.message,true); } };
  // 分享卡片
  $("#sh_plan_go").onclick=()=>{ const v=$("#sh_plan").value.trim(); if(v) window.open("/api/share/plan/"+v,"_blank"); };
  $("#sh_mc_go").onclick=()=>{ const v=$("#sh_mc").value.trim(); if(v) window.open("/api/share/machine/"+v,"_blank"); };
}

/* ================= 启动 ================= */
$("#apikey").value = S.key;
$("#savekey").onclick = async ()=>{
  S.key = $("#apikey").value.trim();
  if(!S.key){ toast("请先粘贴 API 密钥", true); return; }
  localStorage.setItem("narwhal_key", S.key);
  paintConn();
  const ok = await verifyKey();
  if(ok){ toast("连接成功!"); route(); }
};
$("#clearkey").onclick = ()=>{
  S.key=""; S.authed=false; localStorage.removeItem("narwhal_key");
  $("#apikey").value=""; paintConn(); route();
};
$("#apikey").onkeydown = e=>{ if(e.key==="Enter") $("#savekey").click(); };
renderTabs();
paintConn();
verifyKey().then(ok=>{ if(ok) route(); else route(); });
</script>
</body>
</html>
